# Flutter gen-l10n config. ARB sources live in lib/l10n; generated Dart lands in
# the synthetic `package:flutter_gen` as AppLocalizations.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# Generate real files under lib/l10n (not the deprecated synthetic package).
synthetic-package: false
output-dir: lib/l10n
