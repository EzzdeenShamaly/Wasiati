name: wasiati

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    # Use pub's resolver across all packages; path deps are linked automatically.
    runPubGetInParallel: true

scripts:
  analyze:
    description: Analyze all packages.
    run: melos exec -- flutter analyze
  test:
    description: Run tests in packages that have them.
    run: melos exec --dir-exists=test -- flutter test
  gen:
    description: Run build_runner codegen (freezed/json) where configured.
    run: melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
